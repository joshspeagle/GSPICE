name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Each run on main has its own group, so it is never cancelled: CLAUDE.md reverts the
# commit that broke CI. A new push to a pull request cancels its older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - { os: macos-latest, python-version: "3.10" }
          - { os: macos-latest, python-version: "3.15" }
          - { os: windows-latest, python-version: "3.10" }
          - { os: windows-latest, python-version: "3.15" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q -ra

  test-oldest:
    name: test (oldest stack, py3.11, numpy 1.26, scipy 1.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt "numpy==1.26.*" "scipy==1.11.*"
      - run: python -m pytest -q -ra

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install "$(grep '^ruff' requirements-dev.txt)"
      - run: ruff check tests
      - run: ruff format --check tests

  slow:
    # Runs only when started by hand, with every test: -m "" lifts the -m "not slow" of
    # pytest.ini.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q -ra -m ""
