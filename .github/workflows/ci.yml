name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Each run on main has its own group, so it is never cancelled: CLAUDE.md reverts the
# commit that broke CI. A new push to a pull request cancels its older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          # One job checks the coverage floor. Coverage adds no measurable time on
          # Python 3.14, which traces with sys.monitoring.
          - { os: ubuntu-latest, python-version: "3.14", cov: "--cov=gspice" }
          - { os: macos-latest, python-version: "3.11" }
          - { os: macos-latest, python-version: "3.15" }
          - { os: windows-latest, python-version: "3.11" }
          - { os: windows-latest, python-version: "3.15" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # --group needs pip 25.1.
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --no-compile . --group test
      - run: python -m pytest -q -ra ${{ matrix.cov }}

  test-oldest:
    name: test (oldest stack, py3.11, numpy 1.26, scipy 1.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --no-compile . --group test "numpy==1.26.*" "scipy==1.11.*"
      - run: python -m pytest -q -ra

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --group dev
      - run: ruff check src tests benchmarks tools docs/conf.py
      - run: ruff format --check src tests benchmarks tools docs/conf.py
      - run: mypy
      - run: mypy --python-version 3.11

  dist:
    # Builds the wheel and the sdist, checks their contents, and runs a smoke test of the
    # wheel in a clean environment. It tests the package as a user installs it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - run: python tools/check_dist.py dist
      # -I and another directory keep the source tree off the import path.
      - run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP" && clean/bin/python -I "$GITHUB_WORKSPACE/tools/smoke.py"

  slow:
    # Runs only when started by hand, with every test: -m "" lifts the -m "not slow" of
    # pyproject.toml.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --no-compile . --group test
      - run: python -m pytest -q -ra -m ""
