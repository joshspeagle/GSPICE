name: Release

# A tag vX.Y.Z runs CI, uploads the wheel and the sdist of its dist job to PyPI as
# pygspice once the lead approves the deployment to the environment pypi, then publishes
# a GitHub release with them and the CHANGELOG section of X.Y.Z.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  check:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # The tag must name the version of the built package.
      - run: test -f "dist/pygspice-${GITHUB_REF_NAME#v}-py3-none-any.whl"
      - run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            /^## / { inside = index($0, "## " version " ") == 1; next }
            inside
          ' CHANGELOG.md > notes.md
          test -s notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes.md

  pypi:
    # PyPI trusts this workflow and environment (trusted publishing), so no token is
    # stored. An uploaded version can never be uploaded again.
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pygspice/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: notes
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "GSPICE $GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
