<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 465" role="img" aria-labelledby="flow-title" font-size="13" style="display:block;width:100%;max-width:740px;height:auto;margin:1.5em auto">
<title id="flow-title">The five steps of repair</title>
<defs>
<marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="currentColor"/></marker>
<marker id="flow-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#F0592A"/></marker>
</defs>
<rect x="30" y="14" width="620" height="60" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.2"/>
<text x="42" y="32" text-anchor="start" fill="currentColor" font-weight="bold">1  Pixelwise pass</text>
<text x="42" y="50" text-anchor="start" fill="currentColor" font-size="12">z<tspan baseline-shift="sub" font-size="10">1</tspan> = pixelwise z of x</text>
<text x="42" y="67" text-anchor="start" fill="currentColor" font-size="12">M<tspan baseline-shift="sub" font-size="10">1</tspan> = dil(|z<tspan baseline-shift="sub" font-size="10">1</tspan>| &gt; nsigma_replace) ∪ bad,   I<tspan baseline-shift="sub" font-size="10">1</tspan> = dil(|z<tspan baseline-shift="sub" font-size="10">1</tspan>| &gt; nsigma_ignore) minus M<tspan baseline-shift="sub" font-size="10">1</tspan></text>
<line x1="340.0" y1="74" x2="340.0" y2="94" stroke="currentColor" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
<rect x="30" y="96" width="620" height="60" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.2"/>
<text x="42" y="114" text-anchor="start" fill="currentColor" font-weight="bold">2  Block pass (blockwise=True)</text>
<text x="42" y="132" text-anchor="start" fill="currentColor" font-size="12">infill M<tspan baseline-shift="sub" font-size="10">1</tspan> ∪ I<tspan baseline-shift="sub" font-size="10">1</tspan>; flag the block of largest χ²<tspan baseline-shift="sub" font-size="10">A</tspan> / threshold if it exceeds 1</text>
<text x="42" y="149" text-anchor="start" fill="currentColor" font-size="12">its pixels join M<tspan baseline-shift="sub" font-size="10">b</tspan>; infill M<tspan baseline-shift="sub" font-size="10">1</tspan> ∪ I<tspan baseline-shift="sub" font-size="10">1</tspan> ∪ M<tspan baseline-shift="sub" font-size="10">b</tspan> again</text>
<path d="M650,142h16V110h-14" fill="none" stroke="#F0592A" stroke-width="1.6" marker-end="url(#flow-loop)"/>
<text x="672" y="124.0" text-anchor="start" font-size="11" fill="#F0592A">repeat while</text>
<text x="672" y="138.0" text-anchor="start" font-size="11" fill="#F0592A">a ratio &gt; 1</text>
<line x1="340.0" y1="156" x2="340.0" y2="176" stroke="currentColor" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
<rect x="30" y="178" width="620" height="77" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.2"/>
<text x="42" y="196" text-anchor="start" fill="currentColor" font-weight="bold">3  Second pixelwise pass</text>
<text x="42" y="214" text-anchor="start" fill="currentColor" font-size="12">x<tspan baseline-shift="sub" font-size="10">1</tspan> = infill of M<tspan baseline-shift="sub" font-size="10">1</tspan> ∪ M<tspan baseline-shift="sub" font-size="10">b</tspan>, ignoring I<tspan baseline-shift="sub" font-size="10">1</tspan>;   z<tspan baseline-shift="sub" font-size="10">2</tspan> = z of x against the prediction from x<tspan baseline-shift="sub" font-size="10">1</tspan></text>
<text x="42" y="231" text-anchor="start" fill="currentColor" font-size="12">M = dil(|z<tspan baseline-shift="sub" font-size="10">2</tspan>| &gt; nsigma_replace, or |z<tspan baseline-shift="sub" font-size="10">1</tspan>| &gt; nsigma_replace and |z<tspan baseline-shift="sub" font-size="10">2</tspan>| &gt; nsigma_ignore) ∪ M<tspan baseline-shift="sub" font-size="10">b</tspan> ∪ bad,</text>
<text x="42" y="248" text-anchor="start" fill="currentColor" font-size="12">I = dil(|z<tspan baseline-shift="sub" font-size="10">2</tspan>| &gt; nsigma_ignore) minus M</text>
<line x1="340.0" y1="255" x2="340.0" y2="275" stroke="currentColor" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
<rect x="30" y="277" width="620" height="60" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.2"/>
<text x="42" y="295" text-anchor="start" fill="currentColor" font-weight="bold">4  Exclusion (runlength not None)</text>
<text x="42" y="313" text-anchor="start" fill="currentColor" font-size="12">a run of at least runlength pixels of K adds the pixels within halfwidth of it to I,</text>
<text x="42" y="330" text-anchor="start" fill="currentColor" font-size="12">unless fewer than floor(minfrac · npix) conditioning pixels would remain</text>
<line x1="340.0" y1="337" x2="340.0" y2="357" stroke="currentColor" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
<rect x="30" y="359" width="620" height="44" rx="6" fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-width="1.2"/>
<text x="42" y="377" text-anchor="start" fill="currentColor" font-weight="bold">5  Final infill</text>
<text x="42" y="395" text-anchor="start" fill="currentColor" font-size="12">infill with replace = M and ignore = I, in flux units</text>
<line x1="340.0" y1="403" x2="340.0" y2="423" stroke="currentColor" stroke-width="1.2" marker-end="url(#flow-arrow)"/>
<rect x="140" y="425" width="400" height="30" rx="15" fill="none" stroke="#F0592A" stroke-width="1.6"/>
<text x="340.0" y="445" text-anchor="middle" fill="currentColor">Repaired: replaced = M, ignored = I, blocks flagged</text>
</svg>
