<text x="120.0" y="245.0" text-anchor="middle" fill="currentColor" opacity="0.7">P<tspan baseline-shift="sub" font-size="10">OO</tspan></text>
<text x="270.0" y="245.0" text-anchor="middle" fill="currentColor" opacity="0.7">P<tspan baseline-shift="sub" font-size="10">OO</tspan></text>
<path d="M170,40V280M70,140H310M230,40V280M70,200H310" stroke="currentColor" stroke-width="0.8" stroke-dasharray="3 3" fill="none"/>
