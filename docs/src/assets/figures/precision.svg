<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" role="img" aria-labelledby="prec-title" font-size="13" style="display:block;width:100%;max-width:680px;height:auto;margin:1.5em auto">
<title id="prec-title">The partition of the precision matrix P into the blocks of G and O</title>
