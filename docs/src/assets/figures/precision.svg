<text x="470" y="158" text-anchor="start" fill="currentColor" font-size="14">x<tspan baseline-shift="sub" font-size="10">G</tspan> | x<tspan baseline-shift="sub" font-size="10">O</tspan> ~ N(μ<tspan baseline-shift="sub" font-size="10">G</tspan>, P<tspan baseline-shift="sub" font-size="10">GG</tspan><tspan baseline-shift="super" font-size="10">−1</tspan>)</text>
<text x="470" y="184" text-anchor="start" fill="currentColor" font-size="14">μ<tspan baseline-shift="sub" font-size="10">G</tspan> = −P<tspan baseline-shift="sub" font-size="10">GG</tspan><tspan baseline-shift="super" font-size="10">−1</tspan> P<tspan baseline-shift="sub" font-size="10">GO</tspan> x<tspan baseline-shift="sub" font-size="10">O</tspan></text>
