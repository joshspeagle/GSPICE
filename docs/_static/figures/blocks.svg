<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 184" role="img" aria-labelledby="blk-title" font-size="13" style="display:block;width:100%;max-width:700px;height:auto;margin:1.5em auto">
<title id="blk-title">Block scan: overlapping blocks along the spectrum; one block and its guard, with the conditioning pixels outside them</title>
<defs>
<pattern id="blk-hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.6"/></pattern>
</defs>
<rect x="320" y="52" width="20" height="16" fill="url(#blk-hatch)" stroke="currentColor" stroke-width="0.8"/>
<rect x="490" y="52" width="20" height="16" fill="url(#blk-hatch)" stroke="currentColor" stroke-width="0.8"/>
<rect x="340" y="52" width="150" height="16" fill="#F0592A" stroke="currentColor" stroke-width="0.8"/>
<rect x="40" y="52" width="280" height="16" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="0.8"/>
<text x="180.0" y="64" text-anchor="middle" fill="currentColor" font-size="12">O</text>
<rect x="510" y="52" width="130" height="16" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="0.8"/>
<text x="575.0" y="64" text-anchor="middle" fill="currentColor" font-size="12">O</text>
<text x="415.0" y="26" text-anchor="middle" fill="currentColor">block A, flagged: χ²<tspan baseline-shift="sub" font-size="10">A</tspan> above its threshold</text>
<text x="330.0" y="44" text-anchor="end" fill="currentColor" font-size="12">guard</text>
<text x="500.0" y="44" text-anchor="start" fill="currentColor" font-size="12">guard</text>
<rect x="40" y="94" width="150" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1"/>
