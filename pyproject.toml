[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gspice"
dynamic = ["version"]
requires-python = ">=3.11"
# The oldest stack that CI tests.
dependencies = ["numpy>=1.26", "scipy>=1.11"]
# Provisional (design decision S11.8).
license = "GPL-3.0-only"
authors = [
    { name = "Douglas P. Finkbeiner" },
    { name = "Joshua S. Speagle" },
    { name = "Tanveer Karim" },
]

[dependency-groups]
test = ["pytest>=8", "pytest-cov>=5"]
dev = [
    { include-group = "test" },
    "ruff==0.17.1",
    "mypy==2.4.0",
    # scipy ships no type information; scipy-stubs 1.18 needs Python 3.12.
    "scipy-stubs==1.18.1.1; python_version >= '3.12'",
    "pre-commit",
]

[tool.hatch.version]
path = "src/gspice/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '--strict-markers -m "not slow"'
markers = [
    "slow: takes more than 5 s on a CI runner or has a Monte Carlo tolerance; run with -m slow",
]

[tool.mypy]
strict = true
# The oldest supported Python, so that mypy rejects newer standard-library names.
python_version = "3.11"
files = ["src/gspice"]
# The 2022 code keeps its untyped signatures (design section 7.1).
exclude = ["^src/gspice/legacy/"]

[[tool.mypy.overrides]]
module = "gspice.legacy.*"
follow_imports = "skip"

[tool.coverage.run]
omit = ["*/gspice/legacy/*"]

[tool.coverage.report]
fail_under = 90
# Without decimals, a total of 89.5% would round up and pass.
precision = 2

[tool.ruff.lint.per-file-ignores]
# The 2022 module names are API (design decision A29).
"src/gspice/legacy/matrixUtils.py" = ["N999"]
"src/gspice/legacy/specUtils.py" = ["N999"]

[tool.ruff.lint.isort]
known-first-party = ["_golden"]
