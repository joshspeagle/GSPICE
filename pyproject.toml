[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
# PyPI does not allow the name gspice. The import name is gspice.
name = "pygspice"
dynamic = ["version"]
description = "Gaussian pixelwise conditional estimation for spectra"
readme = "README.md"
requires-python = ">=3.11"
# The oldest stack that CI tests.
dependencies = ["numpy>=1.26", "scipy>=1.11"]
license = "GPL-3.0-or-later"
authors = [
    { name = "Douglas P. Finkbeiner" },
    { name = "Joshua S. Speagle" },
    { name = "Tanveer Karim" },
]

[project.urls]
Documentation = "https://joshspeagle.github.io/GSPICE/"
Repository = "https://github.com/joshspeagle/GSPICE"
Changelog = "https://github.com/joshspeagle/GSPICE/blob/main/CHANGELOG.md"

[dependency-groups]
test = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6"]
dev = [
    { include-group = "test" },
    "ruff==0.17.1",
    "mypy==2.4.0",
    # scipy ships no type information; scipy-stubs 1.18 needs Python 3.12.
    "scipy-stubs==1.18.1.1; python_version >= '3.12'",
    "pre-commit",
]
# docs/scripts/api.py
docs = ["griffe==2.4.1"]
# docs/scripts/logo.py; woff adds brotli, which reads the woff2 font
logo = ["fonttools[woff]==4.67.0"]

[tool.hatch.version]
path = "src/gspice/__init__.py"

# hatchling finds src/<name> on its own only when the names match.
[tool.hatch.build.targets.wheel]
packages = ["src/gspice"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/CHANGELOG.md", "/CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '--strict-markers -m "not slow"'
markers = [
    "slow: takes more than 5 s on a CI runner or has a Monte Carlo tolerance; run with -m slow",
]

[tool.mypy]
strict = true
# Under the rules of Python 3.11 the numpy stubs type ArrayLike as Any. The commands
# also run mypy --python-version 3.11, which rejects newer standard-library names.
python_version = "3.12"
# tests/test_typing.py calls the public API as code outside the package.
files = ["src/gspice", "tests/test_typing.py"]
# The 2022 code keeps its untyped signatures (design section 7.1).
exclude = ["^src/gspice/legacy/"]

[[tool.mypy.overrides]]
module = "gspice.legacy.*"
follow_imports = "skip"

[tool.coverage.run]
omit = ["*/gspice/legacy/*"]

[tool.coverage.report]
fail_under = 90
# Without decimals, a total of 89.5% would round up and pass.
precision = 2

[tool.ruff.lint.per-file-ignores]
# The 2022 module names are API (design decision A29).
"src/gspice/legacy/matrixUtils.py" = ["N999"]
"src/gspice/legacy/specUtils.py" = ["N999"]
# The code of r26 that tests/test_repair.py compares with, vendored unchanged.
"tests/r26/*" = ["C408", "F841", "I001", "N999", "RUF059"]

[tool.ruff.format]
exclude = ["tests/r26/*"]

[tool.ruff.lint.isort]
known-first-party = ["_golden", "oracle", "test_golden"]
